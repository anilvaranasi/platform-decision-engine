domains:
  - id: "HR"
    name: "Human Resources"
    capabilities:
      - id: "hr.onboarding"
        name: "Employee Onboarding"
        description: "Pre-boarding, identity verification, onboarding task management, equipment provisioning, and orientation"
        sub_capabilities:
          - id: "hr.onboarding.workflow"
            name: "Onboarding Workflow & Portal"
            category: "engagement"
          - id: "hr.onboarding.process_mining"
            name: "Onboarding Process Mining & Discovery"
            category: "intelligence"
      - id: "hr.master_data"
        name: "HR Master Data Management"
        description: "Employee records, organizational management, position control"
        category: "record"
      - id: "hr.process_mining"
        name: "HR Process Mining & Optimization"
        description: "Process telemetry, root-cause bottleneck discovery across HR systems"
        category: "intelligence"

  - id: "CRM"
    name: "Customer Relationship Management"
    capabilities:
      - id: "crm.process"
        name: "CRM Sales & Account Lifecycle"
        description: "End-to-end customer and sales lifecycle processes"
        category: "record_and_engagement"
      - id: "crm.pipeline"
        name: "Opportunity & Pipeline Management"
        description: "Deals, forecasting, CPQ"
        category: "record"
      - id: "crm.customer_portal"
        name: "Customer Service Portal"
        description: "Self-service cases and portal"
        category: "engagement"

  - id: "FINANCE"
    name: "Finance & Payroll"
    capabilities:
      - id: "finance.payroll"
        name: "Payroll Processing & Rules"
        description: "Gross-to-net calculation, payroll runs, statutory pay rules"
        category: "record"
      - id: "finance.tax_compliance"
        name: "Tax Compliance & Statutory Reporting"
        description: "Jurisdictional tax compliance and filing"
        category: "record"

  - id: "WORKFLOW"
    name: "Cross-Domain Workflow & Automation"
    capabilities:
      - id: "workflow.custom_app"
        name: "Custom Workflow Applications"
        description: "Rapid bespoke business applications and user interfaces"
        category: "engagement"
      - id: "workflow.orchestration"
        name: "Integration & Task Orchestration"
        description: "Multi-system event routing and human-in-the-loop coordination"
        category: "orchestration"
